name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tuesday 20:15 Asia/Taipei (UTC+8). GitHub may delay scheduled jobs.
    - cron: '15 12 * * 2'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-site
    env:
      DEPLOY_TARGET: github-pages
      CASE_CONTENT_MODE: anonymous
      CASE_PREVIEW_ENABLED: 'false'
      WEBSITE_RELEASE_MODE: production
      NEXT_PUBLIC_STATIC_SITE: 'true'
      NEXT_PUBLIC_INTAKE_API_URL: https://hansondm.app.n8n.cloud/webhook/hanson-website-intake-v1
      SMARTSHEET_SUBMISSIONS_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync official Firstory RSS
        run: python3 scripts/sync-podcast.py
      - name: Build approved website
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: next-site/out
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
